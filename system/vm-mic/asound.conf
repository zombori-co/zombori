# Installed as /etc/asound.conf by system/vm-mic/install.sh (target VM only).
# Sound plays on the real (virtual HDA) card; recording comes from the Loopback card, which
# zombori-vm-mic.service fills with the Mac's microphone streamed by vm/mic.sh.
pcm.!default {
    type asym
    playback.pcm "plughw:0,0"
    # Loopback (card 5, see snd-aloop.conf): what is played into device 0 comes out of device 1.
    capture.pcm "plughw:5,1"
}
