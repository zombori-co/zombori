# Zombori on a MacBook Air M1 (Asahi): sound plays on the speakers (device 1, "Secondary":
# device 0 feeds the headphone jack); recording comes from the built-in microphones, a separate
# card. plug converts rate and channels both ways. Installed as /etc/asound.conf (docs/05).
pcm.!default {
    type asym
    playback.pcm "plughw:AppleJ313,1"
    capture.pcm "zombori_mics"
}
# The three built-in microphones send raw 32-bit float with no gain (on Asahi, PipeWire normally
# adds it). Mix them into one channel, each x10 (about +30 dB), then let plug convert the rest.
pcm.zombori_mics {
    type plug
    slave.pcm "zombori_mics_mix"
}
pcm.zombori_mics_mix {
    type route
    slave {
        pcm "zombori_mics_raw"
        format S32_LE
        channels 3
    }
    ttable.0.0 10.0
    ttable.0.1 10.0
    ttable.0.2 10.0
}
# The microphones only speak float; lfloat turns it into integers, which route works on.
pcm.zombori_mics_raw {
    type lfloat
    slave {
        pcm "hw:AppleJ313HPAI,0"
        format FLOAT_LE
    }
}
ctl.!default {
    type hw
    card AppleJ313
}
