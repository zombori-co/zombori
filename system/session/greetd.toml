# greetd: who is logged in on the screen after the gate. Installed as /etc/greetd/config.toml by
# system/dev-install.sh, which fills in your user name.
#
# At boot, once the gate has heard the right answer, the initial session logs you in without a
# password and starts the tavern. If that session ever ends (the tavern exits or crashes), greetd
# falls back to the default session: an ordinary text login that asks for your password.

[terminal]
vt = 1

[initial_session]
command = "/usr/local/bin/zombori-session"
user = "@USER@"

[default_session]
command = "/usr/sbin/agreety --cmd /bin/bash"
user = "_greetd"
