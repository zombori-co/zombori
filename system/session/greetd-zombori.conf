# Drop-in for greetd.service, installed as /etc/systemd/system/greetd.service.d/zombori.conf.
# The automatic login happens only after the gate has heard the right answer, and greetd owns the
# first console instead of the plain login prompt.
[Unit]
After=zombori-gate.service
# Stop the plain login prompt on the first console before starting (the usual display-manager pair).
Conflicts=getty@tty1.service
After=getty@tty1.service
